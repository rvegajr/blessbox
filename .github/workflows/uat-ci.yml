name: UAT CI

# UAT environment (uat branch → uat.blessbox.org, blessbox-uat DB).
# Vercel's Git integration builds & deploys the branch to its assigned domain
# automatically, so this workflow does NOT run `vercel deploy`; its job is to
# validate the branch and keep the blessbox-uat schema migrated on every push.
on:
  push:
    branches: [ uat ]
  pull_request:
    branches: [ uat ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Type check
      run: npx tsc --noEmit

    - name: Lint
      run: npm run lint

    - name: Unit tests (vitest)
      run: npm run test -- --run

    - name: Build project
      run: npm run build

  migrate-uat:
    runs-on: ubuntu-latest
    needs: test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/uat'
    # Serialize so two uat pushes never migrate blessbox-uat concurrently.
    concurrency: migrate-uat

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    # Idempotent: baseline is adopted on an already-provisioned DB, then only
    # new forward migrations apply. Safe to run on every push.
    - name: Apply DB migrations (blessbox-uat)
      run: npm run db:migrate:deploy
      env:
        TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL_UAT }}
        TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN_UAT }}
