name: Pull Request Validation

on:
  pull_request:
    # Gate PRs into every environment branch (prod=main, uat, dev=develop) with
    # the same typecheck + lint + unit-test + build + smoke validation, so a
    # change is vetted identically at each promotion hop.
    branches: [ main, develop, uat ]

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Type check
      run: npx tsc --noEmit

    - name: Lint
      run: npm run lint

    - name: Unit tests (vitest)
      run: npm run test -- --run

    - name: Build project
      run: npm run build

    # Best-effort PR comment. Skipped for forked PRs (no write token) and never
    # fails the job — the gate is tsc/lint/test/build above, not the comment.
    - name: Comment PR
      if: success() && github.event.pull_request.head.repo.full_name == github.repository
      continue-on-error: true
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: 'Build Validation Passed\n\nThis pull request has been validated and is ready for review.\n\nNode.js Version: 20.x\nCommit: ${{ github.sha }}'
          })

  security-scan:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Full audit for visibility (never fails the build).
    - name: Run security audit (informational)
      run: npm audit --audit-level=moderate
      continue-on-error: true

    # The deploy gate blocks on HIGH/CRITICAL in *production* dependencies only
    # (`--omit=dev`) — vulnerabilities that actually ship to users. Dev-tooling
    # advisories don't gate a deploy: e.g. esbuild's dev-server issue
    # (GHSA-67mh-4wv8-2f99, officially moderate) rides in via drizzle-kit and
    # never runs in prod, yet some npm versions score it "high". Prod-dep
    # high/critical still fail the build. Residual moderates (transitive axios
    # via the Square SDK — axios 1.18.1 is latest) are informational only.
    - name: Check for high/critical vulnerabilities (production deps)
      run: |
        npm audit --omit=dev --json > audit.json || true
        HIGH=$(jq '.metadata.vulnerabilities.high' audit.json)
        CRIT=$(jq '.metadata.vulnerabilities.critical' audit.json)
        echo "prod deps: high=$HIGH critical=$CRIT"
        if [ "$HIGH" -gt 0 ] || [ "$CRIT" -gt 0 ]; then
          echo "::error::High/critical vulnerabilities in production dependencies"
          npm audit --omit=dev --audit-level=high
          exit 1
        fi
        echo "No high/critical vulnerabilities in production dependencies."

  smoke:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright browser
      run: npx playwright install --with-deps chromium

    # The dev server boots from this env; specs self-seed via /api/test/seed
    # (non-prod). Traklet disabled so its dev overlay can't intercept clicks.
    - name: Run smoke tests
      run: npm run test:smoke:ci
      env:
        JWT_SECRET: ci-smoke-jwt-secret-do-not-use-in-prod-0123456789
        NEXTAUTH_SECRET: ci-smoke-jwt-secret-do-not-use-in-prod-0123456789
        NEXT_PUBLIC_APP_URL: http://localhost:7777
        PUBLIC_APP_URL: http://localhost:7777

    - name: Upload Playwright report
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 7
