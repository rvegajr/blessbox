name: Promote

# Forward-promotion pipeline:  develop → uat → main
#
# When a merge lands on develop or uat, auto-open the next-stage promotion PR.
# When a merge lands on main (e.g. a straight-to-prod hotfix), auto-open
# back-sync PRs to uat + develop so the lower environments never drift.
#
# The PRs are opened with PROMOTE_PAT — a fine-grained PAT (Contents: read,
# Pull requests: write). This matters: PRs opened with the default GITHUB_TOKEN
# do NOT trigger other workflows, so the pull-request.yml gates would never run.
# A PAT-opened PR triggers them normally. If PROMOTE_PAT is unset the workflow
# skips gracefully (a warning, not a failure).

on:
  push:
    branches: [ develop, uat, main ]

permissions:
  contents: read
  pull-requests: write

jobs:
  open-prs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PROMOTE_PAT || github.token }}

      - name: Open promotion / back-sync PRs
        env:
          GH_TOKEN: ${{ secrets.PROMOTE_PAT }}
        run: |
          set -uo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::PROMOTE_PAT not set — auto-promotion skipped. Add the secret to enable the pipeline."
            exit 0
          fi

          # ensure_pr <from> <to> <title>
          # Opens a PR from→to only when their trees actually differ (content,
          # not merge-commit topology) and no such PR is already open.
          ensure_pr() {
            local from="$1" to="$2" title="$3"
            git fetch -q origin "$from" "$to" || { echo "::warning::fetch $from/$to failed"; return 0; }
            if git diff --quiet "origin/$to" "origin/$from"; then
              echo "$title: origin/$to and origin/$from are content-identical — nothing to open."
              return 0
            fi
            local existing
            existing=$(gh pr list --base "$to" --head "$from" --state open --json number --jq '.[0].number' 2>/dev/null || true)
            if [ -n "${existing:-}" ]; then
              echo "$title: PR #$existing already open (auto-updates as $from advances)."
              return 0
            fi
            local ahead
            ahead=$(git rev-list --count "origin/$to..origin/$from" 2>/dev/null || echo '?')
            gh pr create --base "$to" --head "$from" \
              --title "$title" \
              --body "$(printf 'Automated by the promotion pipeline. %s commit(s) ahead of %s.\n\nMerge once the gate checks are green to advance the environment.' "$ahead" "$to")" \
              && echo "$title: opened." \
              || echo "::warning::could not open PR ($title)"
          }

          case "${GITHUB_REF_NAME}" in
            develop) ensure_pr develop uat  "Promote: develop → uat" ;;
            uat)     ensure_pr uat     main "Promote: uat → main" ;;
            main)
              ensure_pr main uat     "Back-sync: main → uat"
              ensure_pr main develop "Back-sync: main → develop"
              ;;
            *) echo "No promotion rule for ${GITHUB_REF_NAME}." ;;
          esac
